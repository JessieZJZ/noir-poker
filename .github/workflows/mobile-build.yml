name: Mobile build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # i18n:check extracts rendered messages through Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run i18n:check
      - run: npm run check

  wechat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run wechat:build
      - run: npm run wechat:verify
      - run: npm run wechat:check
      - run: node --test tests/unit/wechat*.test.js
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wechat-import-project
          path: .artifacts/wechat/

  table-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep '(public-area|stable-actions|readability-hints|play-viewport|settlement-layout|hint-banner)\.spec\.js'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: table-geometry-results
          path: test-results/
          retention-days: 7

  browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=${{ matrix.project }} --grep-invert '(public-area|stable-actions|readability-hints|play-viewport|settlement-layout|hint-banner)\.spec\.js'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-ui-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NOIR_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Reserve space for the Android 36 system image
        run: |
          df -h "$HOME"
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift
          df -h "$HOME"
          task_available_kib="$(df -Pk "$HOME" | awk 'NR == 2 { print $4 }')"
          test "$task_available_kib" -ge 10485760
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the runner's Android SDK 36
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - run: npm ci
      - run: npm run mobile:android
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-debug-apk
          path: .artifacts/mobile/noir-poker-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Unsigned store-bundle compilation check
        working-directory: android
        env:
          NOIR_SKIP_WEB_PREPARE: '1'
        run: ./gradlew bundleRelease --no-daemon
      - run: npm run mobile:verify:artifact -- android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - run: npm run mobile:test:setup -- android
      - name: Enable KVM for the Android test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          df -h "$HOME"
      - name: Installed Android App end-to-end tests
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          disable-animations: true
          pre-emulator-launch-script: |
            df -h "$HOME"
            test "$(df -Pk "$HOME" | awk 'NR == 2 { print $4 }')" -ge 10485760
          script: npm run mobile:test:android
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-native-e2e-results
          path: .artifacts/native-e2e/android/
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NOIR_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run mobile:ios
      - name: Package simulator app without a distribution signature
        run: ditto -c -k --sequesterRsrc --keepParent .artifacts/mobile/ios/Build/Products/Debug-iphonesimulator/App.app .artifacts/mobile/noir-poker-ios-simulator.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-simulator-app
          path: .artifacts/mobile/noir-poker-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
      - run: npm run mobile:test:setup -- ios
      - run: npm run mobile:test:ios
        timeout-minutes: 20
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-native-e2e-results
          path: .artifacts/native-e2e/ios/
          retention-days: 7
