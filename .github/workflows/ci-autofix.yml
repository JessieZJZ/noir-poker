name: Codex CI repair

on:
  workflow_run:
    workflows: [Mobile build]
    types: [completed]

permissions: {}

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  CI_AUTOFIX_CANDIDATE: ${{ github.workspace }}/candidate
  CI_AUTOFIX_PATCH: ${{ github.workspace }}/ci-autofix.patch

jobs:
  generate:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.actor.id == github.event.repository.owner.id &&
      github.event.workflow_run.triggering_actor.id == github.event.repository.owner.id &&
      !startsWith(github.event.workflow_run.head_branch, 'codex/ci-fix-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ci-autofix-generate
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check provider configuration
        id: key
        env:
          PROVIDER_KEY: ${{ secrets.CI_AUTOFIX_OPENAI_API_KEY }}
        run: |
          if [[ -z "$PROVIDER_KEY" ]]; then
            echo "::notice::Add CI_AUTOFIX_OPENAI_API_KEY to the ci-autofix-generate environment."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out trusted automation
        if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Confirm revision and collect failed check logs
        if: steps.key.outputs.ready == 'true'
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CI_AUTOFIX_PROMPT: ${{ runner.temp }}/ci-autofix-prompt.txt
        run: node automation/.github/ci-autofix.mjs prepare
      - name: Check out the failed revision
        if: steps.prepare.outputs.sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Propose a repair
        if: steps.prepare.outputs.sha != ''
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          working-directory: ${{ env.CI_AUTOFIX_CANDIDATE }}
          prompt-file: ${{ runner.temp }}/ci-autofix-prompt.txt
          openai-api-key: ${{ secrets.CI_AUTOFIX_OPENAI_API_KEY }}
          codex-version: '0.169.0'
          safety-strategy: drop-sudo
          permission-profile: ':workspace'
          codex-args: '["--ephemeral"]'
      - name: Export checked patch
        if: steps.prepare.outputs.sha != ''
        id: patch
        run: node automation/.github/ci-autofix.mjs collect
      - name: Save patch for verification
        id: upload
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-autofix-patch
          path: ${{ env.CI_AUTOFIX_PATCH }}
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: generate
    if: needs.generate.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out the failed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.generate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Download patch from this workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          path: ${{ github.workspace }}
          merge-multiple: true
      - name: Validate and apply patch
        run: node automation/.github/ci-autofix.mjs apply-patch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check the patched revision
        working-directory: candidate
        run: |
          npm ci
          npm run format:check
          npm run check

  publish:
    needs: [generate, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ci-autofix-publish
    permissions:
      contents: read
    steps:
      - name: Check publisher configuration
        id: key
        env:
          PUBLISHER_TOKEN: ${{ secrets.CI_AUTOFIX_GITHUB_TOKEN }}
        run: |
          if [[ -z "$PUBLISHER_TOKEN" ]]; then
            echo "::warning::Add CI_AUTOFIX_GITHUB_TOKEN to the ci-autofix-publish environment to open a repair PR."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out trusted automation
        if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out the failed revision
        if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.generate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Download verified patch
        if: steps.key.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          path: ${{ github.workspace }}
          merge-multiple: true
      - name: Open a draft repair PR
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_AUTOFIX_GITHUB_TOKEN }}
        run: node automation/.github/ci-autofix.mjs publish
