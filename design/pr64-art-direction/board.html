<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NOIR · 方案总览</title>
    <style>
      @font-face {
        font-family: Manrope;
        src: url('/assets/fonts/manrope.woff2');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1800px;
        height: 1120px;
        background: #08100e;
        color: #edf5ee;
        font-family: Manrope, 'PingFang SC', sans-serif;
        padding: 44px 55px;
        overflow: hidden;
      }
      .head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        border-bottom: 1px solid #ffffff20;
        padding-bottom: 26px;
      }
      .tag {
        font-size: 13px;
        letter-spacing: 0.18em;
        color: #90b5a2;
      }
      h1 {
        font-size: 44px;
        font-weight: 500;
        margin: 10px 0 0;
        letter-spacing: -0.04em;
      }
      .meta {
        text-align: right;
        font-size: 13px;
        color: #9db3a5;
        line-height: 1.9;
      }
      .layout {
        display: grid;
        grid-template-columns: 1250px 344px;
        gap: 62px;
        margin-top: 28px;
      }
      .label {
        font-size: 12px;
        color: #96b0a0;
        letter-spacing: 0.12em;
        margin-bottom: 14px;
      }
      .desktop {
        width: 1250px;
        height: 868px;
        object-fit: contain;
        object-position: top;
        background: #030705;
        border: 1px solid #ffffff20;
        border-radius: 16px;
      }
      .phone {
        width: 320px;
        height: 694px;
        object-fit: contain;
        border: 1px solid #ffffff2a;
        border-radius: 23px;
        background: #030705;
      }
      .notes {
        font-size: 14px;
        color: #9fb5a7;
        line-height: 2.1;
        margin: 23px 0 0;
      }
      .accent {
        font-size: 13px;
        color: var(--accent);
        display: block;
        margin-bottom: 8px;
      }
      .swatches {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
      .swatches span {
        width: 37px;
        height: 8px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <div>
        <span class="tag" id="en"></span>
        <h1 id="title"></h1>
      </div>
      <div class="meta">
        NOIR POKER / PR64 / ART DIRECTION<br />最终候选视觉 · 浏览器渲染 · 各端还原目标
      </div>
    </div>
    <div class="layout">
      <div>
        <div class="label">DESKTOP WEB / 1440 × 1000</div>
        <img class="desktop" id="desktop" />
      </div>
      <div>
        <div class="label">iOS DESIGN TARGET / 393 × 852</div>
        <img class="phone" id="phone" />
        <div class="notes">
          <span class="accent" id="tag"></span><span id="description"></span>
          <div class="swatches" id="swatches"></div>
          <small
            >移动 Web / iOS / Android / 微信 / 平板<br />完整逐页图与36秒有声样片见设计目录</small
          >
        </div>
      </div>
    </div>
    <script type="module">
      import { themes } from './manifest.mjs';
      let t =
        themes.find((t) => t.id === new URLSearchParams(location.search).get('theme')) || themes[0];
      let i = themes.indexOf(t);
      document.body.style.setProperty('--accent', t.accent);
      document.body.style.background = t.bg;
      document.getElementById('en').textContent = '0' + (i + 1) + ' / ' + t.en;
      document.getElementById('title').textContent = t.name;
      document.getElementById('tag').textContent = t.tag;
      document.getElementById('description').textContent = t.description;
      document.getElementById('swatches').innerHTML = [t.accent, t.felt, t.panel]
        .map((c) => `<span style="background:${c}"></span>`)
        .join('');
      for (let [k, d] of [
        ['desktop', 'desktop'],
        ['phone', 'ios'],
      ])
        document.getElementById(k).src = `/output/screens/${t.id}/${d}/table9.webp`;
    </script>
  </body>
</html>
